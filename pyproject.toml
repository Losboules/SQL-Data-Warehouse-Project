[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "northstar-retail-data-platform"
version = "0.1.0"
description = "Beginner-owned end-to-end retail data engineering portfolio project"
requires-python = ">=3.13,<3.15"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Kirolos Boules"}]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py313"
exclude = ["datasets", "notebooks"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
ignore = ["E501"]
